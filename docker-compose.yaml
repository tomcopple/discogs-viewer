version: '3.8'

services:
  discogs-viewer:
    build: .
    container_name: discogs-viewer
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - DISCOGS_TOKEN=${DISCOGS_TOKEN}
      - DISCOGS_USERNAME=${DISCOGS_USERNAME}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_SECRET=${LASTFM_SECRET}
      - PORT=3000
    restart: unless-stopped